propose:
  description: >
    Vous proposez la motion : {motion}.
    Formulez un argument clair en faveur de cette motion.
    Soyez très convaincant.
  expected_output: >
    Un argument clair et concis en faveur de la motion.
  agent: debater
  output_file: output/propose.md

oppose:
  description: >
    Vous êtes opposé à la motion : {motion}.
    Formulez un argument clair contre cette motion.
    Soyez très convaincant.
  expected_output: >
    Un argument clair et concis contre la motion.
  agent: debater
  output_file: output/oppose.md

decide:
  description: >
    Analysez les arguments présentés par les débatteurs et décidez quel camp est le plus convaincant.
  expected_output: >
    Votre décision sur le camp le plus convaincant, accompagnée d’une brève justification.
  agent: judge
  output_file: output/decide.md
