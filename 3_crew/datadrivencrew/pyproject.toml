[project]
name = "datadrivencrew"
version = "0.1.0"
description = "DataDrivenCrew using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==1.5.0"
]

[project.scripts]
datadrivencrew = "datadrivencrew.main:run"
run_crew = "datadrivencrew.main:run"
train = "datadrivencrew.main:train"
replay = "datadrivencrew.main:replay"
test = "datadrivencrew.main:test"
run_with_trigger = "datadrivencrew.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
